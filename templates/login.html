{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% set title = "Log in" %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    {{ m.csrf() }}
    <label>Username <input name="username" maxlength="{{ max_username_length }}" required autofocus></label>
    <label>Password <input name="password" type="password" required></label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('lunch.signup') }}">Join the team</a></p>
</section>
{% endblock %}
