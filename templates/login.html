{% extends "base.html" %}
{% block title %}Log in · Tenpax Lunch{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    <label>Username <input name="username" required autofocus></label>
    <label>Password <input name="password" type="password" required></label>
    <button>Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('signup') }}">Join the team</a></p>
</section>
{% endblock %}
