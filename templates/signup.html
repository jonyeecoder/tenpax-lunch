{% extends "base.html" %}
{% block title %}Join · Tenpax Lunch{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Join the team</h1>
  <form method="post">
    <label>Team code <input name="team_code" required autofocus></label>
    <label>Username <input name="username" required></label>
    <label>Password <input name="password" type="password" minlength="{{ min_password_length }}" required></label>
    <button>Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
